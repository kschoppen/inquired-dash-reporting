<!DOCTYPE html>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>inquirED — Reporting (Internal)</title>
  <meta name="audience" content="internal" />
  <link rel="icon" type="image/svg+xml" href="assets/inquirED_Favicon_Green.svg" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css" />

<body>
  <script>
    // The left rail folds away on wide screens, like the GTM hub's; the choice is remembered per browser. Set before paint, so no flash.
    try { if (localStorage.getItem("dash-rail") === "off") document.documentElement.classList.add("rail-off"); } catch (e) {}
  </script>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar">
    <button class="rail-btn" type="button" id="rail-btn" aria-controls="sidebar">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7.5 3.5v13" stroke="currentColor" stroke-width="1.6"/></svg>
      <span class="sr-only" id="rail-btn-label">Hide the menu</span>
    </button>
    <button class="menu-btn" type="button" id="menu-btn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <span class="topbar-title" id="topbar-title">Reporting Dash</span>
    <span class="topbar-fresh" id="topbar-fresh"></span>
  </header>
  <nav class="rail" id="sidebar" aria-label="Reports">
    <!-- Home (the mark and the name, one link), then the three places. The GTM hub's rail has the same top
         (marketing-hub src/components/Sidebar.astro); keep the two in step. Links, not a toggle, because they navigate. -->
    <div class="rail-top">
      <a class="rail-home" href="./" title="Reporting Dash home"><img class="rail-logo" src="assets/inquirED_Logo_White.svg" alt="inquirED" /><span class="rail-name">Reporting Dash</span></a>
      <nav class="rail-places" aria-label="GTM Hub">
        <a href="https://inquired-gtm-hub.netlify.app/marketing/">Marketing</a>
        <a href="https://inquired-gtm-hub.netlify.app/sales/">Sales and PE</a>
        <a href="./" class="on" aria-current="true">Reporting</a>
      </nav>
    </div>
    <div class="rail-grp">
      <p class="rail-eyebrow">Reports</p>
      <div class="tabs-btns" id="tabs-btns"></div>
    </div>
    <div class="rail-foot"><span class="header-badge">Internal</span></div>
  </nav>
  <div class="rail-scrim" id="scrim" hidden></div>
  <div id="tab-meta" class="page-head" hidden></div>
  <main id="view"><div class="loading">Loading…</div></main>
  <div id="tab-sources-footer" class="tab-sources-footer" hidden></div>
  <footer class="foot">
    Internal reporting dashboard · managed in <a href="https://github.com/kschoppen/inquired-dash-reporting" target="_blank" rel="noopener">kschoppen/inquired-dash-reporting</a> · Netlify auto-deploys on push to main
  </footer>
  <script src="assets/methodology.js"></script>
  <script src="assets/app.js"></script>
  <script src="assets/chat.js"></script>
</body>
</html>
